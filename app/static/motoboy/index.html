<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Poranga — Motoboy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="estilo.css" />
<style>
#mapa { height: 260px; width: 100%; }
.pedido-item { border: 1.5px solid var(--cinza-borda); padding: 14px; border-radius: 12px; margin-bottom: 10px; transition: border-color 0.15s ease; }
.pedido-item:hover { border-color: var(--laranja); }
.pedido-item-nome { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.pedido-item-itens { font-size: 13px; color: var(--cinza-texto); margin-bottom: 8px; }
.pedido-item-valores { font-size: 13px; color: var(--escuro); margin-bottom: 10px; }
</style>
</head>
<body>

<div class="topo">
  <svg class="topo-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="18" r="3"></circle>
    <circle cx="19" cy="18" r="3"></circle>
    <path d="M8 18h6l3-8h3M5 18l3-9h4l2 4"></path>
  </svg>
  <h1>Motoboy — Poranga</h1>
</div>

<div id="app">
  <div id="mensagem-flutuante"></div>

  <div id="auth-section" class="cartao">
    <h3>Entrar</h3>
    <label>Telefone</label>
    <input id="login-telefone" placeholder="92999999999">
    <label>Senha</label>
    <input id="login-senha" type="password" placeholder="Sua senha">
    <button onclick="fazerLogin()">Entrar</button>
  </div>

  <div id="logado-section" class="hidden">
    <div class="cartao">
      <div class="saudacao-caixa" style="margin-bottom: 14px;">
        <span class="saudacao-nome" id="saudacao"></span>
        <button class="secundario pequeno" onclick="sair()">Sair</button>
      </div>
      <p style="margin-bottom: 10px;">Status: <span id="status-badge" class="status-badge">-</span></p>
      <button id="btn-alternar-status" onclick="alternarStatus()">Ficar disponível</button>
    </div>

    <div id="pendentes-section" class="cartao hidden">
      <h3>Pedidos pendentes</h3>
      <div id="lista-pendentes"></div>
    </div>

    <div id="pedido-atual-section" class="cartao hidden">
      <h3>Pedido em andamento</h3>
      <p class="pedido-item-nome" id="pa-origem"></p>
      <p class="pedido-item-itens" id="pa-itens"></p>
      <p class="pedido-item-valores" id="pa-valor"></p>
      <p style="margin-bottom: 12px;">Status: <span id="pa-status" class="status-badge">-</span></p>
      <div class="mapa-caixa"><div id="mapa"></div></div>
      <button id="btn-avancar" onclick="avancarStatus()">Avançar status</button>
      <button class="perigo" onclick="cancelarPedido()">Cancelar pedido</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="motoboy.js"></script>
</body>
</html>
