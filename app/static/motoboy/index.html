<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Motoboy — Sistema de Delivery Poranga</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
    .hidden { display: none !important; }
    #app { max-width: 480px; margin: 0 auto; padding: 16px; }
    h2 { margin-top: 0; }
    input, textarea, select {
      width: 100%; padding: 8px; margin-bottom: 8px;
      border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
    }
    button {
      width: 100%; padding: 10px; background: #2563eb; color: white;
      border: none; border-radius: 4px; font-size: 15px; cursor: pointer;
      margin-bottom: 8px;
    }
    button.secundario { background: #6b7280; }
    button.perigo { background: #dc2626; }
    button.sucesso { background: #16a34a; }
    #mapa { height: 260px; width: 100%; border-radius: 6px; margin-bottom: 8px; }
    .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 12px; font-weight: bold; color: white;
    }
    #msg { color: #dc2626; font-size: 13px; margin-bottom: 8px; }
    small { color: #666; }
    .pedido-item { border: 1px solid #eee; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
    .pedido-item button { width: auto; padding: 4px 10px; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
<div id="app">
  <h2>🛵 Motoboy — Poranga</h2>
  <div id="msg"></div>

  <!-- LOGIN -->
  <div id="auth-section" class="card">
    <h3>Entrar</h3>
    <input id="login-telefone" placeholder="Telefone (ex: 92999999999)">
    <input id="login-senha" type="password" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
  </div>

  <!-- LOGADO -->
  <div id="logado-section" class="hidden">
    <div class="card">
      <strong id="saudacao"></strong>
      <p>Status: <span id="status-badge" class="status-badge">-</span></p>
      <button id="btn-alternar-status" onclick="alternarStatus()">Ficar disponível</button>
      <button class="secundario" onclick="sair()">Sair</button>
    </div>

    <!-- LISTA DE PEDIDOS PENDENTES -->
    <div id="pendentes-section" class="card hidden">
      <h3>Pedidos pendentes</h3>
      <div id="lista-pendentes"></div>
    </div>

    <!-- PEDIDO ATUAL -->
    <div id="pedido-atual-section" class="card hidden">
      <h3>Pedido em andamento</h3>
      <p><strong id="pa-origem"></strong></p>
      <p id="pa-itens"></p>
      <p id="pa-valor"></p>
      <p>Status: <span id="pa-status" class="status-badge">-</span></p>
      <div id="mapa"></div>
      <button id="btn-avancar" onclick="avancarStatus()">Avançar status</button>
      <button class="perigo" onclick="cancelarPedido()">Cancelar pedido</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="motoboy.js"></script>
</body>
</html>
