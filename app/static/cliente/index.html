<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Delivery Poranga — Cliente</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="estilo.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
    .hidden { display: none !important; }
    #app { max-width: 480px; margin: 0 auto; padding: 16px; }
    h2 { margin-top: 0; }
    input, textarea, select {
      width: 100%; padding: 8px; margin-bottom: 8px;
      border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
    }
    button {
      width: 100%; padding: 10px; background: #2563eb; color: white;
      border: none; border-radius: 4px; font-size: 15px; cursor: pointer;
      margin-bottom: 8px;
    }
    button.secundario { background: #6b7280; }
    button.perigo { background: #dc2626; }
    #map-picker, #map-acompanhar { height: 260px; width: 100%; border-radius: 6px; margin-bottom: 8px; }
    .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .status-badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 12px; font-weight: bold; color: white;
    }
    #msg { color: #dc2626; font-size: 13px; margin-bottom: 8px; }
    #tabs button { width: 48%; display: inline-block; }
    small { color: #666; }
  </style>
</head>
<body>
<div id="app">
  <h2>🛵 Delivery Poranga</h2>
  <div id="msg"></div>

  <!-- LOGIN / CADASTRO -->
  <div id="auth-section" class="card">
    <div id="tabs">
      <button onclick="mostrarAba('login')">Entrar</button>
      <button class="secundario" onclick="mostrarAba('cadastro')">Criar conta</button>
    </div>

    <div id="aba-login">
      <input id="login-telefone" placeholder="Telefone (ex: 92999999999)">
      <input id="login-senha" type="password" placeholder="Senha">
      <button onclick="fazerLogin()">Entrar</button>
    </div>

    <div id="aba-cadastro" class="hidden">
      <input id="cad-nome" placeholder="Seu nome">
      <input id="cad-telefone" placeholder="Telefone (ex: 92999999999)">
      <input id="cad-senha" type="password" placeholder="Senha (mín. 6 caracteres)">
      <button onclick="fazerCadastro()">Criar conta</button>
    </div>
  </div>

  <!-- LOGADO -->
  <div id="logado-section" class="hidden">
    <div class="card">
      <strong id="saudacao"></strong>
      <button class="secundario" onclick="sair()">Sair</button>
    </div>

    <!-- ENDEREÇOS -->
    <div id="enderecos-section" class="card">
      <h3>Meus endereços</h3>
      <div id="lista-enderecos"></div>
      <button onclick="mostrarFormEndereco()">+ Novo endereço</button>

      <div id="form-endereco" class="hidden">
        <p><small>Clica no mapa pra marcar o local de entrega</small></p>
        <div id="map-picker"></div>
        <input id="end-apelido" placeholder="Apelido (ex: Casa, Trabalho)" value="Casa">
        <input id="end-logradouro" placeholder="Rua/Avenida">
        <input id="end-numero" placeholder="Número">
        <input id="end-bairro" placeholder="Bairro" value="Poranga">
        <input id="end-complemento" placeholder="Complemento (opcional)">
        <input id="end-referencia" placeholder="Ponto de referência (opcional)">
        <input id="end-cidade" placeholder="Cidade" value="Itacoatiara">
        <input id="end-estado" placeholder="Estado" value="AM">
        <button onclick="salvarEndereco()">Salvar endereço</button>
        <button class="secundario" onclick="esconderFormEndereco()">Cancelar</button>
      </div>
    </div>

    <!-- NOVO PEDIDO -->
    <div id="pedido-section" class="card hidden">
      <h3>Fazer pedido</h3>
      <p><small>Clica no mapa pra marcar o estabelecimento (origem)</small></p>
      <div id="map-picker-origem" style="height:220px;border-radius:6px;margin-bottom:8px;"></div>
      <input id="ped-origem-nome" placeholder="Nome do estabelecimento">
      <textarea id="ped-itens" placeholder="O que você quer pedir?" rows="3"></textarea>
      <input id="ped-valor" type="number" step="0.01" placeholder="Valor total (R$)">
      <input id="ped-taxa" type="number" step="0.01" placeholder="Taxa de entrega (R$)" value="0">
      <input id="ped-obs" placeholder="Observações (opcional)">
      <button onclick="criarPedido()">Confirmar pedido</button>
    </div>

    <!-- ACOMPANHAMENTO -->
    <div id="acompanhar-section" class="card hidden">
      <h3>Seu pedido</h3>
      <p>Status: <span id="pedido-status" class="status-badge">-</span></p>
      <div id="map-acompanhar"></div>
      <button class="secundario" onclick="voltarParaNovoPedido()">Fazer novo pedido</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="cliente.js"></script>
</body>
</html>
