<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Delivery Poranga</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --laranja: #FF6B35;
  --laranja-escuro: #E85A2A;
  --vermelho: #E23744;
  --fundo: #14120F;
  --cartao: #1F1B16;
  --texto: #F5EFE6;
  --texto-secundario: #A89C8A;
  --verde: #4CAF50;
  --borda: #2E281F;
  --sombra-elevada: 0 8px 28px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--fundo);
  color: var(--texto);
}

#map { height: 100vh; width: 100vw; }

#login-box {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 1000;
  background: var(--cartao);
  border: 1px solid var(--borda);
  padding: 20px;
  border-radius: 16px;
  box-shadow: var(--sombra-elevada);
  width: 220px;
}

#login-box h1 {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--laranja);
  margin-bottom: 14px;
}

#login-box input {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 10px 12px;
  border: 1.5px solid var(--borda);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: var(--texto);
  background: var(--fundo);
}

#login-box input::placeholder { color: #5C5445; }

#login-box input:focus {
  outline: none;
  border-color: var(--laranja);
  box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.18);
}

#login-box button {
  width: 100%;
  padding: 10px;
  background: var(--laranja);
  color: #14120F;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s ease;
}

#login-box button:hover { background: var(--laranja-escuro); }

#status {
  position: absolute;
  bottom: 16px;
  left: 16px;
  z-index: 1000;
  background: var(--cartao);
  border: 1px solid var(--borda);
  color: var(--texto-secundario);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--sombra-elevada);
}
</style>
<style>
/* Nova camada visual — painel administrativo */
:root { --laranja:#ffb84d; --laranja-escuro:#e99a2f; --fundo:#0f1110; --cartao:rgba(23,26,23,.94); --texto:#f8f4ea; --texto-secundario:#a9b0a4; --borda:rgba(248,244,234,.12); }
body { background:var(--fundo); }
#map { filter:saturate(.82) contrast(1.02); }
#login-box { top:24px; left:24px; width:292px; padding:24px; border-radius:22px; background:linear-gradient(145deg,rgba(29,33,29,.97),rgba(18,21,18,.95)); border:1px solid var(--borda); box-shadow:0 24px 70px rgba(0,0,0,.45); backdrop-filter:blur(18px); animation:admin-in .35s cubic-bezier(.23,1,.32,1) both; }
#login-box::before { content:'OPERAÇÃO EM TEMPO REAL'; display:block; margin-bottom:12px; color:var(--laranja); font-size:10px; font-weight:800; letter-spacing:.16em; }
#login-box h1 { color:var(--texto); font-size:24px; letter-spacing:-.04em; margin-bottom:18px; }
#login-box h1::after { content:'  •  Poranga'; color:var(--laranja); font:800 11px Inter,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
#login-box input { padding:13px 14px; border:1px solid var(--borda); border-radius:12px; background:rgba(15,17,16,.82); color:var(--texto); }
#login-box input:focus { border-color:var(--laranja); box-shadow:0 0 0 4px rgba(255,184,77,.13); }
#login-box button { padding:13px; margin-top:6px; border-radius:12px; background:var(--laranja); color:#16130d; font-weight:800; box-shadow:0 10px 22px rgba(255,184,77,.17); transition:transform .16s ease,background .16s ease; }
#login-box button:hover { background:var(--laranja-escuro); transform:translateY(-1px); }
#status { bottom:24px; left:24px; padding:10px 14px; border-radius:12px; background:rgba(23,26,23,.94); border:1px solid var(--borda); color:var(--texto-secundario); box-shadow:0 14px 36px rgba(0,0,0,.3); backdrop-filter:blur(14px); }
.leaflet-control-zoom a { background:#171a17 !important; color:var(--texto) !important; border-color:var(--borda) !important; }
@keyframes admin-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
@media (max-width:560px) { #login-box { top:14px; left:14px; right:14px; width:auto; } #status { left:14px; bottom:14px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
  <div id="login-box">
    <h1>Admin Poranga</h1>
    <input id="telefone" placeholder="Telefone admin" value="92991234567">
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="conectar()">Conectar</button>
  </div>
  <div id="status">Desconectado</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="admin.js"></script>
</body>
</html>
